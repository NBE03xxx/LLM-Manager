[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "0.1.0.dev0"
description = "Safely diagnose and optimize local or SSH Ollama/OpenCode hosts"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "LLM-Manager contributors" }]
dependencies = [
    "cryptography>=46.0.5,<47",
    "SecretStorage>=3.5,<4; sys_platform == 'linux'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
